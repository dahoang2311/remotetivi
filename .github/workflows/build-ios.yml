name: Build iOS App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Display Xcode Environment & Available Schemes
      run: |
        xcodebuild -version
        xcodebuild -list -project SamsungRemote.xcodeproj

    - name: Build and Archive for iOS Device (Release)
      run: |
        xcodebuild -project SamsungRemote.xcodeproj \
                   -scheme SamsungRemote \
                   -configuration Release \
                   -sdk iphoneos \
                   -archivePath build/SamsungRemote.xcarchive \
                   CODE_SIGNING_ALLOWED=NO \
                   CODE_SIGNING_REQUIRED=NO \
                   CODE_SIGN_IDENTITY="" \
                   clean archive

    - name: Package Payload into IPA
      run: |
        mkdir -p build/Payload
        cp -r build/SamsungRemote.xcarchive/Products/Applications/SamsungRemote.app build/Payload/
        cd build && zip -r -y SamsungRemote.ipa Payload
        echo "Successfully packaged SamsungRemote.ipa"

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SamsungRemote-IPA
        path: build/SamsungRemote.ipa
        retention-days: 7
