name: Build iOS App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Select Xcode Version
      run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

    - name: Build App (Simulator / Unsigned)
      run: |
        xcodebuild -project SamsungRemote.xcodeproj \
                   -scheme SamsungRemote \
                   -configuration Debug \
                   -sdk iphonesimulator \
                   -destination 'platform=iOS Simulator,name=iPhone 15 Pro' \
                   build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

    - name: Build Archive for Device
      run: |
        xcodebuild -project SamsungRemote.xcodeproj \
                   -scheme SamsungRemote \
                   -configuration Release \
                   -sdk iphoneos \
                   -archivePath build/SamsungRemote.xcarchive \
                   archive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

    - name: Export Payload to IPA
      run: |
        mkdir -p build/Payload
        cp -r build/SamsungRemote.xcarchive/Products/Applications/SamsungRemote.app build/Payload/
        cd build && zip -r SamsungRemote.ipa Payload
        echo "Built SamsungRemote.ipa successfully"

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SamsungRemote-IPA
        path: build/SamsungRemote.ipa
        retention-days: 7
